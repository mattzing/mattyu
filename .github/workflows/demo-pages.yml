name: Deploy demo site to GitHub Pages

# Demo deploy for the make-site skill. Publishes ./demo to GitHub Pages.
# Triggered from the feature branch so it can run end-to-end in-session;
# the bundled skill workflow (assets/deploy-pages.yml) triggers on main.
# Re-run: Pages was enabled manually (Source: GitHub Actions), so the
# previously-blocked "create site" call is skipped and the deploy proceeds.
# Env note: github-pages deployment-branch restriction opened to this branch.

on:
  push:
    branches: [claude/wizardly-mayer-KAvab]
    paths: ['demo/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
