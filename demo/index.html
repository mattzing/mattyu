<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Private</title>
<style>
  :root{--bg:#0b0d12;--panel:#141821;--fg:#e7e9ee;--muted:#8a92a6;--accent:#e8b85f;--err:#ff6b6b;--line:#232838}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
    color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
  .card{width:min(92vw,380px);background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:30px 28px;box-shadow:0 30px 80px -40px #000}
  .lock{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:20px;
    background:#1d2230;border:1px solid var(--line);margin-bottom:18px}
  h1{font-size:18px;margin:0 0 6px;font-weight:600}
  .sub{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
  form{display:flex;flex-direction:column;gap:12px}
  input{padding:12px 14px;border-radius:9px;border:1px solid #2a3142;background:#0e1219;
    color:var(--fg);font-size:15px}
  input:focus{outline:none;border-color:var(--accent)}
  button{padding:12px 14px;border:0;border-radius:9px;background:var(--accent);color:#241a08;
    font-weight:600;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6;cursor:progress}
  .err{color:var(--err);font-size:13px;min-height:16px}
</style>
</head>
