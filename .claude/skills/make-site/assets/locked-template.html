<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>__TITLE__</title>
<style>
  :root{--bg:#0b0d12;--panel:#141821;--fg:#e7e9ee;--muted:#8a92a6;--accent:#e8b85f;--err:#ff6b6b;--line:#232838}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
    color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
  .card{width:min(92vw,380px);background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:30px 28px;box-shadow:0 30px 80px -40px #000}
  .lock{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:20px;
    background:#1d2230;border:1px solid var(--line);margin-bottom:18px}
  h1{font-size:18px;margin:0 0 6px;font-weight:600}
  .sub{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
  form{display:flex;flex-direction:column;gap:12px}
  input{padding:12px 14px;border-radius:9px;border:1px solid #2a3142;background:#0e1219;
    color:var(--fg);font-size:15px}
  input:focus{outline:none;border-color:var(--accent)}
  button{padding:12px 14px;border:0;border-radius:9px;background:var(--accent);color:#241a08;
    font-weight:600;font-size:15px;cursor:pointer}
  button:disabled{opacity:.6;cursor:progress}
  .err{color:var(--err);font-size:13px;min-height:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="lock" aria-hidden="true">🔒</div>
    <h1>__TITLE__</h1>
    <p class="sub">This page is password-protected. Enter the password to view it.</p>
    <form id="f" autocomplete="off">
      <input id="pw" type="password" placeholder="Password" autofocus aria-label="Password" />
      <button id="go" type="submit">Unlock</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>
<script>
  // Encrypted payload (AES-256-GCM; key = PBKDF2-SHA256 of the password).
  // Parameters must match scripts/lib-crypto.mjs.
  var SALT="__SALT__", IV="__IV__", CT="__CT__", ITER=__ITER__;
  var b = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };

  async function unlock(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b(SALT), iterations:ITER, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b(IV) }, key, b(CT));
    return new TextDecoder().decode(buf); // throws on wrong password (GCM tag fails)
  }

  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async function(e){
    e.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Unlocking…';
    try {
      var html = await unlock(pw.value);
      document.open(); document.write(html); document.close(); // reveal the real page
    } catch (_) {
      err.textContent = 'Wrong password. Try again.';
      go.disabled=false; go.textContent='Unlock'; pw.select();
    }
  });
</script>
</body>
</html>
